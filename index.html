<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: transparent;
			font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
		}

		/* 遮罩层 */
		.popup-mask {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, 0.55);
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 9999;
			animation: fadeIn 0.3s ease-out;
		}

		/* 卡片 */
		.popup-card {
			position: relative;
			width: 70%;
			max-width: 280px;
			border-radius: 20px;
			overflow: hidden;
			animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
		}

		/* 图片 */
		.card-img {
			display: block;
			width: 100%;
			height: auto;
			filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
		}

		/* 底部按钮热区 */
		.btn-hotspot {
			position: absolute;
			left: 18%;
			width: 64%;
			bottom: 5%;
			height: 10%;
			border-radius: 999px;
			cursor: pointer;
			z-index: 10;
		}

		.btn-hotspot:active {
			background: rgba(0, 0, 0, 0.06);
		}

		/* 动画 */
		@keyframes fadeIn {
			from { opacity: 0; }
			to { opacity: 1; }
		}

		@keyframes popIn {
			from {
				transform: scale(0.7);
				opacity: 0;
			}
			to {
				transform: scale(1);
				opacity: 1;
			}
		}
	</style>
</head>
<body>
	<div class="popup-mask">
		<div class="popup-card">
			<img
				class="card-img"
				src="./blessing-card-one.png"
				alt=""
			/>
			<div class="btn-hotspot" onclick="closePopup()"></div>
		</div>
	</div>

	<script>
		function closePopup() {
			// 1. 微信小程序 web-view
			if (window.wx && window.wx.miniProgram) {
				window.wx.miniProgram.postMessage({ data: { action: 'close' } });
				window.wx.miniProgram.navigateBack();
				return;
			}

			// 2. uni-app web-view
			if (window.uni && window.uni.postMessage) {
				window.uni.postMessage({ data: { action: 'close' } });
			}

			// 3. 普通浏览器：隐藏弹窗
			document.querySelector('.popup-mask').style.display = 'none';
		}
	</script>
</body>
</html>
